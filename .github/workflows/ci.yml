name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:physics
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: npx playwright install --with-deps chromium webkit
        if: ${{ !cancelled() }}
      - run: npm run test:browser
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            test-results/
            playwright-report/
            physics-reports/
          retention-days: 14

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Install browser for live deployment verification
        run: npx playwright install --with-deps chromium
      - name: Verify two consecutive attempts on the deployed site
        run: npm run test:browser -- --project=chromium-touch-landscape --grep "two complete attempts"
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-smoke-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
